name: Build Android (AAB)

# ▶️ รันเมื่อ: กดปุ่ม Run เองในแท็บ Actions (workflow_dispatch) หรือ push เข้า master/main
on:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: write # ให้สิทธิ์สร้าง Release + แนบไฟล์

# 🔑 ดึง secrets มาเป็น env (ถ้ายังไม่ตั้ง = ค่าว่าง → ระบบจะ build debug APK ให้เหมือนเดิม)
env:
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout โค้ด
        uses: actions/checkout@v4

      - name: 🟢 ติดตั้ง Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: ☕ ติดตั้ง Java 17 (จำเป็นสำหรับ Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 📦 ติดตั้ง dependencies
        run: npm install

      # ตั้ง versionCode = หมายเลขรัน เพื่อให้แต่ละครั้งที่อัป Play ไม่ชนกัน (Play ห้าม versionCode ซ้ำ)
      - name: 🔢 ตั้ง versionCode อัตโนมัติ (= run number)
        run: |
          node -e "const fs=require('fs');const p='app.json';const j=JSON.parse(fs.readFileSync(p));j.expo.android=j.expo.android||{};j.expo.android.versionCode=${{ github.run_number }};fs.writeFileSync(p,JSON.stringify(j,null,2));console.log('versionCode =',${{ github.run_number }});"

      - name: 🛠️ สร้างโปรเจกต์ Android (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      # 🔓 ถอดรหัส keystore จาก secret (เฉพาะเมื่อมีตั้งไว้)
      - name: 🔓 เตรียม keystore (ถ้ามี)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/upload.jks"

      # ✅ เซ็น AAB ด้วย upload key เพื่ออัปขึ้น Play (build อย่างเดียว ไม่ทำ APK แล้ว ประหยัดเวลา)
      - name: 🔏 Build AAB (เซ็นด้วย upload key)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/upload.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/paauan-randon.aab"

      - name: ⬆️ อัปโหลดไฟล์เป็น artifact
        uses: actions/upload-artifact@v4
        with:
          name: paauan-randon
          path: paauan-randon.aab
          if-no-files-found: warn

      - name: 🚀 สร้าง GitHub Release พร้อมแนบไฟล์
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ป้าอ้วนสุ่มให้ (build ${{ github.run_number }})
          files: paauan-randon.aab
