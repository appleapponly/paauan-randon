name: Build Android (AAB)

# ▶️ รันเมื่อ: กดปุ่ม Run เองในแท็บ Actions (workflow_dispatch) หรือ push เข้า master/main
on:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: write # ให้สิทธิ์สร้าง Release + แนบไฟล์

# 🔑 ดึง secrets มาเป็น env (ถ้ายังไม่ตั้ง = ค่าว่าง → ระบบจะ build debug APK ให้เหมือนเดิม)
env:
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout โค้ด
        uses: actions/checkout@v4

      - name: 🟢 ติดตั้ง Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: ☕ ติดตั้ง Java 17 (จำเป็นสำหรับ Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ติดตั้ง NDK ล่วงหน้าแบบ retry — กัน gradle โหลดเองแล้วไฟล์พังกลางทาง
      # (เคยเจอ "Archive is not a ZIP archive" ตอน Install NDK ระหว่าง build)
      - name: 🧰 ติดตั้ง NDK 27.1.12297006 (retry 3 รอบ)
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          for i in 1 2 3; do
            if "$SDKMGR" "ndk;27.1.12297006"; then
              echo "NDK installed (attempt $i)"; break
            fi
            echo "attempt $i failed — ลบไฟล์ค้างแล้วลองใหม่"
            rm -rf "$ANDROID_HOME/ndk/27.1.12297006"
            sleep 10
            if [ "$i" = "3" ]; then exit 1; fi
          done

      - name: 📦 ติดตั้ง dependencies
        run: npm install

      # ตั้ง versionCode = หมายเลขรัน เพื่อให้แต่ละครั้งที่อัป Play ไม่ชนกัน (Play ห้าม versionCode ซ้ำ)
      - name: 🔢 ตั้ง versionCode อัตโนมัติ (= run number)
        run: |
          node -e "const fs=require('fs');const p='app.json';const j=JSON.parse(fs.readFileSync(p));j.expo.android=j.expo.android||{};j.expo.android.versionCode=${{ github.run_number }};fs.writeFileSync(p,JSON.stringify(j,null,2));console.log('versionCode =',${{ github.run_number }});"

      # 🔓 ถอดรหัส keystore จาก secret (เฉพาะเมื่อมีตั้งไว้)
      - name: 🔓 เตรียม keystore (ถ้ามี)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/upload.jks"

      # ===== แอปที่ 1: ป้าอ้วนสุ่มให้ (ไทย) =====
      - name: 🛠️ prebuild แอปไทย (ป้าอ้วนสุ่มให้)
        run: npx expo prebuild --platform android --no-install

      - name: 🔏 Build AAB แอปไทย
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/upload.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/paauan-randon.aab"

      # ===== แอปที่ 2: Auntie's Random (สากล) — โค้ดเดิม เปลี่ยนตัวตนด้วย APP_VARIANT =====
      - name: 🛠️ prebuild แอปสากล (Auntie's Random)
        run: APP_VARIANT=global npx expo prebuild --platform android --no-install --clean

      - name: 🔏 Build AAB แอปสากล
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/upload.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/aunties-random.aab"

      - name: ⬆️ อัปโหลดไฟล์เป็น artifact
        uses: actions/upload-artifact@v4
        with:
          name: paauan-randon
          path: |
            paauan-randon.aab
            aunties-random.aab
          if-no-files-found: warn

      - name: 🚀 สร้าง GitHub Release พร้อมแนบไฟล์
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ป้าอ้วนสุ่มให้ + Auntie's Random (build ${{ github.run_number }})
          files: |
            paauan-randon.aab
            aunties-random.aab
